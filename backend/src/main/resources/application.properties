spring.application.name=smartmeal

# ── PostgreSQL (primary) ───────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/smartmealdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Server ─────────────────────────────────────────────────────
server.port=8080

# ── JWT ────────────────────────────────────────────────────────
app.jwt.secret=SmartMeal2024DesignPatternsSecretKeyMustBe256BitsLong!!
app.jwt.expiration-ms=86400000

# ── Google Cloud Vision API ────────────────────────────────────
app.vision.api-key=${GOOGLE_VISION_API_KEY:YOUR_API_KEY_HERE}
app.vision.endpoint=https://vision.googleapis.com/v1/images:annotate

# ── CORS ───────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
